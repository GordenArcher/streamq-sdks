[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamq-python"
version = "0.1.0"
description = "Official Python SDK for the streamq message broker"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Gorden Archer", email = "archergorden@gmail.com" }]
keywords = ["streamq", "message-broker", "pubsub", "websocket", "sse", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Typing :: Typed",
]

dependencies = [
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-aiohttp>=1.0.5",
    "anyio>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/GordenArcher/streamq-sdks"
Repository = "https://github.com/GordenArcher/streamq-sdks"
Documentation = "https://github.com/GordenArcher/streamq-sdks/tree/main/python"
"Bug Tracker" = "https://github.com/GordenArcher/streamq-sdks/issues"
Changelog = "https://github.com/GordenArcher/streamq-sdks/releases"

[tool.hatch.build.targets.wheel]
packages = ["streamq"]

# Exclude test and dev files from the wheel
[tool.hatch.build.targets.wheel.force-include]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "*.pyc",
    "__pycache__/",
    ".pytest_cache/",
    "dist/",
    "*.egg-info/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
