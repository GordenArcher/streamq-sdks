[package]
name = "streamq-rs"
version = "0.1.0"
edition = "2021"
authors = ["Gorden Archer <archergorden@gmail.com>"]
description = "Official Rust SDK for the streamq message broker"
license = "MIT"
homepage = "https://github.com/GordenArcher/streamq-sdks"
repository = "https://github.com/GordenArcher/streamq-sdks"
keywords = ["streamq", "message-broker", "pubsub", "websocket", "sse"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"

# Exclude test files and dev artifacts from the published crate.
# Keeps the download size small and avoids shipping test infrastructure
# that crate consumers don't need.
exclude = [
    "tests/",
    ".github/",
    "*.sh",
]

[dependencies]
# Async HTTP client, JSON + rustls (no OpenSSL dependency).
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

# WebSocket client for WS delivery.
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }

# Async runtime.
tokio = { version = "1", features = ["full"] }

# JSON serialisation/deserialisation.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base64 encode/decode for payload transport.
base64 = "0.22"

# Futures stream utilities for SSE byte stream parsing.
futures-util = "0.3"

# URL parsing and construction.
url = "2"

# Timestamp type with serde support.
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# HTTP mock server for integration tests — no real broker required.
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }

[lib]
name = "streamq"
path = "src/lib.rs"
